apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/C5047433/argocd-example-apps/app-of-apps-repo
    path: .
    targetRevision: master
    directory: 
      recursive: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfheal: true
    
  
